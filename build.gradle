plugins {
    id 'application'
}

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
application { mainClass = 'miningsim.Main' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the headless exploratory simulation benchmark.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'miningsim.benchmark.SimulationBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('activityBenchmark', JavaExec) {
    group = 'verification'
    description = 'Compares full-grid and experimental activity traversal.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'miningsim.benchmark.ActivityBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('materialBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs exploratory mixed-material simulation scenarios.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'miningsim.benchmark.MaterialBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('worldAccessBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs exploratory World get/set access patterns.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'miningsim.benchmark.WorldAccessBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('propagationBenchmark', JavaExec) {
    group = 'verification'
    description = 'Measures cross-boundary activity scenarios and optional lifecycle trace.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'miningsim.benchmark.PropagationBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    if (project.hasProperty('traceActivity')) args 'trace'
}
